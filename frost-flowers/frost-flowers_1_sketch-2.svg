<g id="Display_Type" font-family="'Bodoni Moda', serif" font-style="italic" font-weight="500">
<text x="-2" y="98" font-size="112" fill="#ffffff" clip-path="url(#bandA)">frost</text>
<text x="196" y="9" font-size="5" fill="#ffffff" text-anchor="end">frost</text>
<text x="110" y="222" font-size="116" fill="#ffffff" clip-path="url(#bandC)">you</text>
<text x="196" y="120.5" font-size="5.5" fill="#1a1a1a" text-anchor="end">flowers</text>
</g>
<g id="Poem_on_paths" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="500">
<text font-size="3.40" fill="#1a1a1a"><textPath href="#tp1" startOffset="0.00">The dawn city bus runs with its windows decked in some dazzling finery.</textPath></text>
<text font-size="3.40" fill="#1a1a1a"><textPath href="#tp2" startOffset="0.00">The harsher the dead of winter, the more vividly the frost flowers bloom.</textPath></text>
<text font-size="3.40" fill="#1a1a1a"><textPath href="#tp3" startOffset="0.00">Those who rode this bus yesterday maidens and bachelors, children and grown-ups,</textPath></text>
<text font-size="3.40" fill="#1a1a1a"><textPath href="#tp4" startOffset="0.00">hairdressers, salesmen, housemaids, the jobless / their breath and their sighs</textPath></text>
<text font-size="3.40" fill="#1a1a1a"><textPath href="#tp5" startOffset="0.00">met in secret overnight and brought forth this flashing, breathtaking beauty.</textPath></text>
<text font-size="2.90" fill="#ffffff"><textPath href="#tp6" startOffset="0.00">As if I had wandered into some exhibition,</textPath></text>
<text font-size="2.90" fill="#ffffff"><textPath href="#tp7" startOffset="0.00">I move from seat to seat to look,</textPath></text>
<text font-size="2.90" fill="#ffffff"><textPath href="#tp8" startOffset="0.00">and once again I am drunk on a single petal,</textPath></text>
<text font-size="2.90" fill="#ffffff"><textPath href="#tp9" startOffset="0.00">on its delicate and cold beauty.</textPath></text>
<text font-size="2.90" fill="#ffffff"><textPath href="#tp10" startOffset="0.00">Whose desolate sigh was this?</textPath></text>
<text font-size="2.90" fill="#ffffff"><textPath href="#tp11" startOffset="0.00">What warm heart breathed out this breath of passion?</textPath></text>
<text font-size="2.90" fill="#ffffff"><textPath href="#tp12" startOffset="0.00">For no reason, carefully, with my breath and my finger,</textPath></text>
<text font-size="2.90" fill="#ffffff"><textPath href="#tp13" startOffset="0.00">I wipe away a single frost petal / and press my forehead to the glass.</textPath></text>
<text font-size="2.90" fill="#ffffff"><textPath href="#tp14" startOffset="0.00">A haggard face glimmers in the rattling window</textPath></text>
<text font-size="2.90" fill="#ffffff"><textPath href="#tp15" startOffset="0.00">friend, you walked the road beside me for so long,</textPath></text>
<text font-size="2.90" fill="#ffffff"><textPath href="#tp16" startOffset="0.00">and now I am not even allowed to visit</textPath></text>
</g>
</svg>
