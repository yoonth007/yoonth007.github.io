<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="200mm" viewBox="0 0 200 200">
<title>frost flowers — sketch 2 (rhythm · repetition · movement)</title>
<defs>

</defs>
<g id="Paper" >
<rect width="200" height="200" fill="#ffffff"/>
</g>
<g id="Bars" >
<text x="0" y="0" font-size="5.85" fill="#1a1a1a" font-family="'Archivo Condensed', 'Archivo', sans-serif" font-weight="800" transform="translate(16.56 188) rotate(-90)">The dawn city bus</text>
<text x="0" y="0" font-size="2.6" fill="#1a1a1a" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="500" transform="translate(19.49 188) rotate(-90)">runs with its windows decked in some dazzling finery.</text>
<text x="0" y="0" font-size="8.78" fill="#1a1a1a" font-family="'Archivo Condensed', 'Archivo', sans-serif" font-weight="800" transform="translate(27.24 188) rotate(-90)">The harsher the dead of winter,</text>
<text x="0" y="0" font-size="2.6" fill="#1a1a1a" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="500" transform="translate(30.17 188) rotate(-90)">the more vividly the frost flowers bloom.</text>
<text x="0" y="0" font-size="3.9" fill="#1a1a1a" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="500" transform="translate(34.11 188) rotate(-90)">Those who rode this bus yesterday</text>
<text x="0" y="0" font-size="13.16" fill="#1a1a1a" font-family="'Archivo Condensed', 'Archivo', sans-serif" font-weight="800" transform="translate(45.27 188) rotate(-90)">maidens and bachelors, children and grown-ups,</text>
<text x="0" y="0" font-size="2.6" fill="#1a1a1a" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="500" transform="translate(48.2 188) rotate(-90)">hairdressers, salesmen, housemaids, the jobless</text>
<text x="0" y="0" font-size="5.85" fill="#1a1a1a" font-family="'Archivo Condensed', 'Archivo', sans-serif" font-weight="800" transform="translate(53.67 188) rotate(-90)">their breath and their sighs</text>
<text x="0" y="0" font-size="3.9" fill="#1a1a1a" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="500" transform="translate(57.61 188) rotate(-90)">met in secret overnight and brought forth</text>
<text x="0" y="0" font-size="2.6" fill="#1a1a1a" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="500" transform="translate(60.54 188) rotate(-90)">this flashing, breathtaking beauty.</text>
<text x="0" y="0" font-size="8.78" fill="#1a1a1a" font-family="'Archivo Condensed', 'Archivo', sans-serif" font-weight="800" transform="translate(68.28 188) rotate(-90)">As if I had wandered into some exhibition,</text>
<text x="0" y="0" font-size="2.6" fill="#1a1a1a" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="500" transform="translate(71.21 188) rotate(-90)">I move from seat to seat to look,</text>
<text x="0" y="0" font-size="3.9" fill="#1a1a1a" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="500" transform="translate(75.15 188) rotate(-90)">and once again I am drunk on a single petal,</text>
<text x="0" y="0" font-size="5.85" fill="#1a1a1a" font-family="'Archivo Condensed', 'Archivo', sans-serif" font-weight="800" transform="translate(80.62 188) rotate(-90)">on its delicate and cold beauty.</text>
<text x="0" y="0" font-size="8.78" fill="#1a1a1a" font-family="'Archivo Condensed', 'Archivo', sans-serif" font-weight="800" transform="translate(129.61 196) rotate(-90)">Whose desolate sigh was this?</text>
<text x="0" y="0" font-size="8.78" fill="#1a1a1a" font-family="'Archivo Condensed', 'Archivo', sans-serif" font-weight="800" transform="translate(137.95 196) rotate(-90)">What warm heart breathed out this breath of passion?</text>
<text x="0" y="0" font-size="8.78" fill="#1a1a1a" font-family="'Archivo Condensed', 'Archivo', sans-serif" font-weight="800" transform="translate(146.3 196) rotate(-90)">For no reason, carefully, with my breath and my finger,</text>
<text x="0" y="0" font-size="8.78" fill="#1a1a1a" font-family="'Archivo Condensed', 'Archivo', sans-serif" font-weight="800" transform="translate(154.64 196) rotate(-90)">I wipe away a single frost petal</text>
<text x="0" y="0" font-size="8.78" fill="#1a1a1a" font-family="'Archivo Condensed', 'Archivo', sans-serif" font-weight="800" transform="translate(162.98 196) rotate(-90)">and press my forehead to the glass.</text>
<text x="0" y="0" font-size="8.78" fill="#e0322b" font-family="'Archivo Condensed', 'Archivo', sans-serif" font-weight="800" transform="translate(171.32 196) rotate(-90)">A haggard face glimmers in the rattling window</text>
<text x="0" y="0" font-size="8.78" fill="#1a1a1a" font-family="'Archivo Condensed', 'Archivo', sans-serif" font-weight="800" transform="translate(179.66 196) rotate(-90)">friend, you walked the road beside me for so long,</text>
<text x="0" y="0" font-size="8.78" fill="#1a1a1a" font-family="'Archivo Condensed', 'Archivo', sans-serif" font-weight="800" transform="translate(188 196) rotate(-90)">and now I am not even allowed to visit you.</text>
</g>
<g id="Title" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="500">
<text x="101.17" y="188" font-size="3.9" fill="#1a1a1a" text-anchor="middle">frost flowers</text>
</g>
</svg>
