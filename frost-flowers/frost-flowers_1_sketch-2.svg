<g id="Planes" >
<rect width="200" height="200" fill="#ffffff"/><path d="M190 40L10 168V200H200V40Z" fill="#212121"/>
</g>
<g id="Movement_on_paths" font-family="'Libre Caslon Text', serif" font-style="italic">
<text font-size="3.90" fill="#1a1a1a"><textPath href="#tp1" startOffset="0.00">The dawn city bus  /  runs with its windows decked in some dazzling finery.</textPath></text>
<text font-size="3.31" fill="#ffffff"><textPath href="#tp2" startOffset="0.00">Whose desolate sigh was this?  /  What warm heart breathed out this breath of passion?</textPath></text>
<text font-size="3.31" fill="#ffffff"><textPath href="#tp3" startOffset="0.00">For no reason, carefully, with my breath and my finger,  /  I wipe away a single frost petal</textPath></text>
<text font-size="3.26" fill="#ffffff"><textPath href="#tp4" startOffset="0.00">and press my forehead to the glass.  /  A haggard face glimmers in the rattling window</textPath></text>
<text font-size="2.57" fill="#ffffff"><textPath href="#tp5" startOffset="0.00">friend, you walked the road beside me for so long,  /  and now I am not even allowed to visit you.</textPath></text>
</g>
<g id="Fall" font-family="'Libre Caslon Text', serif" font-style="italic">
<text x="181.38" y="44" font-size="3.90" fill="#1a1a1a" text-anchor="end">The harsher the dead of winter,</text>
<text x="175.19" y="48.4" font-size="3.90" fill="#1a1a1a" text-anchor="end">the more vividly the frost flowers bloom.</text>
<text x="169" y="52.8" font-size="3.90" fill="#1a1a1a" text-anchor="end">Those who rode this bus yesterday</text>
<text x="162.81" y="57.2" font-size="3.90" fill="#1a1a1a" text-anchor="end">maidens and bachelors, children and grown-ups,</text>
<text x="156.62" y="61.6" font-size="3.90" fill="#1a1a1a" text-anchor="end">hairdressers, salesmen, housemaids, the jobless</text>
<text x="150.44" y="66" font-size="3.90" fill="#1a1a1a" text-anchor="end">their breath and their sighs</text>
<text x="144.25" y="70.4" font-size="3.90" fill="#1a1a1a" text-anchor="end">met in secret overnight and brought forth</text>
<text x="125.97" y="83.4" font-size="4.97" fill="#1a1a1a" text-anchor="end">this flashing, breathtaking beauty.</text>
<text x="115.84" y="90.6" font-size="4.97" fill="#1a1a1a" text-anchor="end">As if I had wandered into some exhibition,</text>
<text x="105.72" y="97.8" font-size="4.97" fill="#1a1a1a" text-anchor="end">I move from seat to seat to look,</text>
<text x="95.59" y="105" font-size="4.09" fill="#1a1a1a" text-anchor="end">and once again I am drunk on a single petal,</text>
<text x="85.47" y="112.2" font-size="4.97" fill="#1a1a1a" text-anchor="end">on its delicate and cold beauty.</text>
</g>
<g id="Display" font-family="'Archivo Condensed', 'Archivo', sans-serif" font-weight="800">
<text x="188" y="120" font-size="29.62" fill="#ffffff" text-anchor="end">frost</text>
<text x="188" y="148" font-size="29.62" fill="#ffffff" text-anchor="end">flowers</text>
</g>
