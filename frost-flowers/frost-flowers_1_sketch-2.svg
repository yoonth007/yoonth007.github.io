<g id="Ground" >
<rect width="200" height="200" fill="#111418"/>
</g>
<g id="Mass" >
<text x="-14" y="112" font-size="150" fill="#2a3036" letter-spacing="-4" font-family="'PlayfairBlack', 'Playfair Display'" font-style="italic" font-weight="900">flow</text>
<text x="46" y="214" font-size="150" fill="#363d45" letter-spacing="-4" font-family="'PlayfairBlack', 'Playfair Display'" font-style="italic" font-weight="900">ers</text>
<text x="98" y="204" font-size="92" fill="#e9ecee" letter-spacing="-2" font-family="'PlayfairBlack', 'Playfair Display'" font-style="italic" font-weight="900">you</text>
</g>
<g id="Poem_on_paths" font-family="'CaslonBold', 'Libre Caslon Text'" font-style="italic" font-weight="700">
<text font-size="3.40" fill="#aeb5bc"><textPath href="#wl1" startOffset="0.00">The dawn city bus</textPath></text>
<text font-size="3.40" fill="#aeb5bc"><textPath href="#wl2" startOffset="44.18">runs with its windows decked in some dazzling finery.</textPath></text>
<text font-size="3.40" fill="#aeb5bc"><textPath href="#wl3" startOffset="0.00">The harsher the dead of winter,</textPath></text>
<text font-size="3.40" fill="#aeb5bc"><textPath href="#wl4" startOffset="55.95">the more vividly the frost flowers bloom.</textPath></text>
<text font-size="3.40" fill="#aeb5bc"><textPath href="#wl5" startOffset="0.00">Those who rode this bus yesterday</textPath></text>
<text font-size="3.40" fill="#aeb5bc"><textPath href="#wl6" startOffset="48.66">maidens and bachelors, children and grown-ups,</textPath></text>
<text font-size="3.40" fill="#aeb5bc"><textPath href="#wl7" startOffset="0.00">hairdressers, salesmen, housemaids, the jobless</textPath></text>
<text font-size="3.40" fill="#aeb5bc"><textPath href="#wl8" startOffset="67.78">their breath and their sighs</textPath></text>
<text font-size="3.40" fill="#aeb5bc"><textPath href="#wl9" startOffset="0.00">met in secret overnight and brought forth</textPath></text>
<text font-size="3.40" fill="#aeb5bc"><textPath href="#wl10" startOffset="61.83">this flashing, breathtaking beauty.</textPath></text>
<text font-size="3.40" fill="#aeb5bc"><textPath href="#wl11" startOffset="0.00">As if I had wandered into some exhibition,</textPath></text>
<text font-size="3.40" fill="#aeb5bc"><textPath href="#wl12" startOffset="63.78">I move from seat to seat to look,</textPath></text>
<text font-size="3.40" fill="#aeb5bc"><textPath href="#wl13" startOffset="0.00">and once again I am drunk on a single petal,</textPath></text>
<text font-size="3.40" fill="#aeb5bc"><textPath href="#wl14" startOffset="64.55">on its delicate and cold beauty.</textPath></text>
<text font-size="3.40" fill="#aeb5bc"><textPath href="#wl15" startOffset="0.00">Whose desolate sigh was this?</textPath></text>
<text font-size="3.40" fill="#aeb5bc"><textPath href="#wl16" startOffset="44.80">What warm heart breathed out this breath of passion?</textPath></text>
<text font-size="3.03" fill="#aeb5bc"><textPath href="#wl17" startOffset="0.00">For no reason, carefully, with my breath and my finger,</textPath></text>
<text font-size="3.20" fill="#aeb5bc"><textPath href="#wl18" startOffset="0.00">I wipe away a single frost petal</textPath></text>
<text font-size="3.20" fill="#aeb5bc"><textPath href="#wl19" startOffset="0.00">and press my forehead to the glass.</textPath></text>
<text font-size="3.20" fill="#aeb5bc"><textPath href="#wl20" startOffset="0.00">A haggard face glimmers in the rattling window</textPath></text>
<text font-size="3.20" fill="#aeb5bc"><textPath href="#wl21" startOffset="0.00">friend, you walked the road beside me for so long,</textPath></text>
<text font-size="3.20" fill="#aeb5bc"><textPath href="#wl22" startOffset="0.00">and now I am not even allowed to visit you.</textPath></text>
</g>
</svg>
