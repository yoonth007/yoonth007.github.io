<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="200mm" viewBox="0 0 200 200">
<title>frost flowers — sketch 2</title>
<defs>

</defs>
<g id="Paper" >
<rect width="200" height="200" fill="#ffffff"/>
</g>
<g id="Stepped" >
<text x="184" y="20" font-size="3.3" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">The dawn city bus</text>
<text x="178.4" y="25.4" font-size="3.3" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">runs with its windows decked in some dazzling finery.</text>
<text x="172.8" y="30.8" font-size="3.3" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">The harsher the dead of winter</text>
<text x="167.2" y="36.2" font-size="3.3" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">the more vividly the frost flowers bloom.</text>
<text x="161.6" y="41.6" font-size="3.3" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">Those who rode this bus yesterday</text>
<text x="156" y="47" font-size="3.3" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">maidens and bachelors, children and grown-ups</text>
<text x="150.4" y="52.4" font-size="3.3" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">hairdressers, salesmen, housemaids, the jobless</text>
<text x="144.8" y="57.8" font-size="3.3" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">their breath and their sighs</text>
</g>
<g id="Letter_pair" >
<text x="26" y="160" font-size="100" fill="#1a1a1a" font-family="'EB Garamond', serif">F</text>
<text x="79.2" y="118" font-size="40" fill="#1a1a1a" font-family="'Bodoni Moda', serif" font-style="italic" font-weight="500">f</text>
<text x="98.3" y="94" font-size="2.9" fill="#444" font-family="'EB Garamond', serif">I</text>
<text x="98.3" y="98" font-size="2.9" fill="#444" font-family="'EB Garamond', serif">move</text>
<text x="98.3" y="102" font-size="2.9" fill="#444" font-family="'EB Garamond', serif">from</text>
<text x="98.3" y="106" font-size="2.9" fill="#444" font-family="'EB Garamond', serif">seat</text>
<text x="98.3" y="110" font-size="2.9" fill="#444" font-family="'EB Garamond', serif">to</text>
<text x="98.3" y="114" font-size="2.9" fill="#444" font-family="'EB Garamond', serif">seat</text>
<text x="98.3" y="118" font-size="2.9" fill="#444" font-family="'EB Garamond', serif">to</text>
<text x="98.3" y="122" font-size="2.9" fill="#444" font-family="'EB Garamond', serif">look</text>
<line x1="78.2" y1="135" x2="184" y2="135" stroke="#1a1a1a" stroke-width="0.2"/>
<text x="80.2" y="133.7" font-size="3.3" fill="#1a1a1a" font-family="'EB Garamond', serif" font-style="italic">I wipe away a single frost petal and press my forehead to the glass.</text>
</g>
<g id="Large_line" >
<text x="26" y="180" font-size="7.6" fill="#1a1a1a" font-family="'EB Garamond', serif">Whose desolate sigh was this?</text>
</g>
<g id="Rattle" >
<text x="72.7" y="193.35" font-size="4.2" fill="#9a9a9a" font-family="'EB Garamond', serif">A haggard face glimmers in the rattling window</text><text x="72" y="193" font-size="4.2" fill="#1a1a1a" font-family="'EB Garamond', serif">A haggard face glimmers in the rattling window</text>
</g>
<g id="Caption" >
<text x="0" y="0" font-size="2.6" fill="#1a1a1a" font-family="'EB Garamond', serif" transform="translate(11 186) rotate(-90)">friend, you walked the road beside me for so long, and now I am not even allowed to visit you.</text><line x1="13.2" y1="186" x2="13.2" y2="93.87" stroke="#1a1a1a" stroke-width="0.15"/>
</g>
</svg>
