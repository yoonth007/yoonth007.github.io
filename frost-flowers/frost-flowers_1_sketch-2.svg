<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="200mm" viewBox="0 0 200 200">
<title>frost flowers — sketch 2</title>
<defs>
<linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eeeeec"/><stop offset="0.45" stop-color="#e2e2e0"/><stop offset="1" stop-color="#9a9da1"/></linearGradient>
</defs>
<g id="Paper" >
<rect width="200" height="200" fill="url(#dusk)"/>
</g>
<g id="Hanging_lines" >
<text x="0" y="0" font-size="2.9" fill="#282929" font-family="'EB Garamond', serif" transform="translate(16 10) rotate(90)">The dawn city</text>
<text x="0" y="0" font-size="2.9" fill="#2b2b2c" font-family="'EB Garamond', serif" transform="translate(24 10) rotate(90)">runs with its windows decked in some dazzling</text>
<text x="0" y="0" font-size="2.9" fill="#2d2e2e" font-family="'EB Garamond', serif" transform="translate(32 10) rotate(90)">The harsher the dead of</text>
<text x="0" y="0" font-size="2.9" fill="#2f3031" font-family="'EB Garamond', serif" transform="translate(40 10) rotate(90)">the more vividly the <tspan font-family="'Bodoni Moda', serif" font-style="italic" font-size="5.51">frost</tspan> flowers</text>
<text x="0" y="0" font-size="2.9" fill="#323234" font-family="'EB Garamond', serif" transform="translate(48 10) rotate(90)">Those who rode this bus</text>
<text x="0" y="0" font-size="2.9" fill="#343536" font-family="'EB Garamond', serif" transform="translate(56 10) rotate(90)">maidens and bachelors, children and</text>
<text x="0" y="0" font-size="2.9" fill="#363739" font-family="'EB Garamond', serif" transform="translate(64 10) rotate(90)">hairdressers, salesmen, housemaids, the</text>
<text x="0" y="0" font-size="2.9" fill="#393a3b" font-family="'EB Garamond', serif" transform="translate(72 10) rotate(90)">their <tspan font-family="'Bodoni Moda', serif" font-style="italic" font-size="5.51">breath</tspan> and their</text>
<text x="0" y="0" font-size="2.9" fill="#3b3c3e" font-family="'EB Garamond', serif" transform="translate(80 10) rotate(90)">met in secret overnight and brought</text>
<text x="0" y="0" font-size="2.9" fill="#3d3f40" font-family="'EB Garamond', serif" transform="translate(88 10) rotate(90)">this flashing, breathtaking</text>
<text x="0" y="0" font-size="2.9" fill="#404143" font-family="'EB Garamond', serif" transform="translate(96 10) rotate(90)">As if I had wandered into some</text>
<text x="0" y="0" font-size="2.9" fill="#424345" font-family="'EB Garamond', serif" transform="translate(104 10) rotate(90)">I move from seat to seat to</text>
<text x="0" y="0" font-size="2.9" fill="#444648" font-family="'EB Garamond', serif" transform="translate(112 10) rotate(90)">and once again I am drunk on a single</text>
<text x="0" y="0" font-size="2.9" fill="#47484a" font-family="'EB Garamond', serif" transform="translate(120 10) rotate(90)">on its delicate and cold</text>
<text x="0" y="0" font-size="2.9" fill="#494b4d" font-family="'EB Garamond', serif" transform="translate(128 10) rotate(90)">Whose desolate <tspan font-family="'Bodoni Moda', serif" font-style="italic" font-size="5.51">sigh</tspan> was</text>
<text x="0" y="0" font-size="2.9" fill="#4b4d4f" font-family="'EB Garamond', serif" transform="translate(136 10) rotate(90)">What warm heart breathed out this <tspan font-family="'Bodoni Moda', serif" font-style="italic" font-size="5.51">breath</tspan> of</text>
<text x="0" y="0" font-size="2.9" fill="#4e5052" font-family="'EB Garamond', serif" transform="translate(144 10) rotate(90)">For no reason, carefully, with my <tspan font-family="'Bodoni Moda', serif" font-style="italic" font-size="5.51">breath</tspan> and my</text>
<text x="0" y="0" font-size="2.9" fill="#505255" font-family="'EB Garamond', serif" transform="translate(152 10) rotate(90)">I wipe away a single <tspan font-family="'Bodoni Moda', serif" font-style="italic" font-size="5.51">frost</tspan></text>
<text x="0" y="0" font-size="2.9" fill="#525457" font-family="'EB Garamond', serif" transform="translate(160 10) rotate(90)">and press my forehead to the</text>
<text x="0" y="0" font-size="2.9" fill="#55575a" font-family="'EB Garamond', serif" transform="translate(168 10) rotate(90)">A haggard face glimmers in the rattling</text>
<text x="0" y="0" font-size="2.9" fill="#57595c" font-family="'EB Garamond', serif" transform="translate(176 10) rotate(90)">friend, you walked the road beside me for so</text>
<text x="0" y="0" font-size="2.9" fill="#5a5c5f" font-family="'EB Garamond', serif" transform="translate(184 10) rotate(90)">and now I am not even allowed to visit</text>
</g>
<g id="Fallen_words" >
<text x="15.4" y="30.88" font-size="3.2" fill="#414244" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(90.00 15.4 30.88)">bus</text>
<text x="23.4" y="75.25" font-size="3.2" fill="#424446" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(70.42 23.4 75.25)">finery</text>
<text x="31.4" y="43.45" font-size="3.2" fill="#444547" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(65.65 31.4 43.45)">winter</text>
<text x="39.4" y="64.11" font-size="3.2" fill="#464749" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(79.32 39.4 64.11)">bloom</text>
<text x="47.4" y="46.63" font-size="3.2" fill="#47494b" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(101.06 47.4 46.63)">yesterday</text>
<text x="55.4" y="62.29" font-size="3.2" fill="#494a4d" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(114.44 55.4 62.29)">grown-ups</text>
<text x="63.4" y="64.21" font-size="3.2" fill="#4a4c4e" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(109.32 63.4 64.21)">jobless</text>
<text x="71.4" y="48.68" font-size="3.2" fill="#4c4e50" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(89.58 71.4 48.68)">sighs</text>
<text x="79.4" y="62.2" font-size="3.2" fill="#4d4f52" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(70.16 79.4 62.2)">forth</text>
<text x="87.4" y="47.09" font-size="3.2" fill="#4f5153" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(65.75 87.4 47.09)">beauty</text>
<text x="95.4" y="57.93" font-size="3.2" fill="#515255" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(79.70 95.4 57.93)">exhibition</text>
<text x="103.4" y="45.33" font-size="3.2" fill="#525457" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(101.44 103.4 45.33)">look</text>
<text x="111.4" y="65.48" font-size="3.2" fill="#545658" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(114.52 111.4 65.48)">petal</text>
<text x="119.4" y="41" font-size="3.2" fill="#55575a" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(109.05 119.4 41)">beauty</text>
<text x="127.4" y="55.04" font-size="3.2" fill="#57595c" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(89.16 127.4 55.04)">this?</text>
<text x="135.4" y="72.3" font-size="3.2" fill="#585b5d" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(69.91 135.4 72.3)">passion?</text>
<text x="143.4" y="79.99" font-size="3.2" fill="#5a5c5f" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(65.86 143.4 79.99)">finger</text>
<text x="151.4" y="52.17" font-size="3.2" fill="#5b5e61" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(80.08 151.4 52.17)">petal</text>
<text x="159.4" y="53.01" font-size="3.2" fill="#5d5f63" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(101.81 159.4 53.01)">glass</text>
<text x="167.4" y="64.61" font-size="3.2" fill="#5f6164" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(114.60 167.4 64.61)">window</text>
<text x="175.4" y="68.08" font-size="3.2" fill="#606366" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(108.77 175.4 68.08)">long</text>
<text x="183.4" y="65.47" font-size="3.2" fill="#626468" font-family="'EB Garamond', serif" font-style="italic" transform="rotate(88.74 183.4 65.47)">you</text>
</g>
<g id="Sunk" >
<text x="-2" y="208" font-size="70" fill="#232527" font-family="'Bodoni Moda', serif" font-style="italic">flowers</text>
</g>
</svg>
