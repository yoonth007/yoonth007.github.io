<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="200mm" viewBox="0 0 200 200">
<title>frost flowers — sketch 2</title>
<defs>

</defs>
<g id="Paper" >
<rect width="200" height="200" fill="#ffffff"/>
</g>
<g id="Staircase" font-family="'EB Garamond', serif" fill="#1a1a1a">
<text x="22" y="30" font-size="2.9">The dawn city bus</text>
<text x="26.6" y="35" font-size="2.9">runs with its windows decked in some dazzling finery</text>
<text x="31.2" y="40" font-size="2.9">The harsher the dead of winter</text>
<text x="35.8" y="45" font-size="2.9">the more vividly the frost flowers bloom</text>
<text x="40.4" y="50" font-size="2.9">Those who rode this bus yesterday</text>
<text x="45" y="55" font-size="2.9">maidens and bachelors, children and grown-ups</text>
<text x="49.6" y="60" font-size="2.9">hairdressers, salesmen, housemaids, the jobless</text>
<text x="54.2" y="65" font-size="2.9">their breath and their sighs</text>
<text x="58.8" y="70" font-size="2.9">met in secret overnight and brought forth</text>
<text x="63.4" y="75" font-size="2.9">this flashing, breathtaking beauty</text>
<text x="68" y="80" font-size="2.9">As if I had wandered into some exhibition</text>
<text x="72.6" y="85" font-size="2.9">I move from seat to seat to look</text>
<text x="77.2" y="90" font-size="2.9">and once again I am drunk on a single petal</text>
<text x="81.8" y="101" font-size="2.9">on its delicate and cold beauty</text>
</g>
<g id="Big_i" font-family="'Bodoni Moda', serif" font-style="italic" font-weight="500">
<text x="106.17" y="135.8" font-size="56" fill="#1a1a1a">i</text>
</g>
<g id="Plays" >

</g>
<g id="Edge_Caption" >
<text x="0" y="0" font-size="2.2" fill="#1a1a1a" font-family="'EB Garamond', serif" transform="translate(179.9 188) rotate(-90)">Whose desolate sigh was this?</text>
<text x="0" y="0" font-size="2.2" fill="#1a1a1a" font-family="'EB Garamond', serif" transform="translate(183.1 188) rotate(-90)">For no reason, carefully, with my breath and my finger,</text>
<text x="0" y="0" font-size="2.2" fill="#1a1a1a" font-family="'EB Garamond', serif" transform="translate(186.3 188) rotate(-90)">and press my forehead to the glass.</text>
<text x="0" y="0" font-size="2.2" fill="#1a1a1a" font-family="'EB Garamond', serif" transform="translate(189.5 188) rotate(-90)">friend, you walked the road beside me for so long,</text>
</g>
<g id="Marker" >
<text x="18.66" y="178.65" font-size="2.6" fill="#1a1a1a" font-family="'EB Garamond', serif" letter-spacing="0.5" transform="rotate(-28 22 178)">frost</text>
<text x="19.04" y="178.65" font-size="2.6" fill="#1a1a1a" font-family="'EB Garamond', serif" letter-spacing="0.5" transform="rotate(62 22 178)">flowers</text>
</g>
</svg>
