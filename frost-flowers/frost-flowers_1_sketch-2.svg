<g id="Type_on_a_Path" font-family="'EB Garamond', 'Adobe Garamond Pro', Garamond, serif" font-style="italic">
<text font-size="5.79" fill="#161616"><textPath href="#breath">The dawn city bus   runs with its windows decked in some dazzling finery.   The harsher the dead of winter,   the more vividly the frost flowers bloom.   Those who rode this bus yesterday   maidens and bachelors, children and grown-ups,   hairdressers, salesmen, housemaids, the jobless   their breath and their sighs   met in secret overnight and brought forth   this flashing, breathtaking beauty.   As if I had wandered into some exhibition,   I move from seat to seat to look,   and once again I am drunk on a single petal,   on its delicate and cold beauty.   Whose desolate sigh was this?   What warm heart breathed out this breath of passion?   For no reason, carefully, with my breath and my finger,   I wipe away a single frost petal   and press my forehead to the glass.   A haggard face glimmers in the rattling window   friend, you walked the road beside me for so long,   and now I am not even allowed to visit</textPath></text>
</g>
<g id="Center" font-family="'EB Garamond', 'Adobe Garamond Pro', Garamond, serif" font-style="italic">
