<g id="Poem_on_paths" font-family="'Arno Pro', 'EB Garamond', Garamond, serif" font-style="italic">
<text font-size="2.55" fill="#ffffff"><textPath href="#tp1" startOffset="0.00">The dawn city bus</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp2" startOffset="4.51">runs with its windows decked in some dazzling finery.</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp3" startOffset="0.00">The harsher the dead of winter,</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp4" startOffset="11.06">the more vividly the frost flowers bloom.</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp5" startOffset="0.00">Those who rode this bus yesterday</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp6" startOffset="7.16">maidens and bachelors, children and grown-ups,</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp7" startOffset="0.00">hairdressers, salesmen, housemaids, the jobless</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp8" startOffset="17.10">their breath and their sighs</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp9" startOffset="0.00">met in secret overnight and brought forth</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp10" startOffset="13.42">this flashing, breathtaking beauty.</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp11" startOffset="0.00">As if I had wandered into some exhibition,</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp12" startOffset="15.43">I move from seat to seat to look,</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp13" startOffset="0.00">and once again I am drunk on a single petal,</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp14" startOffset="15.42">on its delicate and cold beauty.</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp15" startOffset="0.00">Whose desolate sigh was this?</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp16" startOffset="4.08">What warm heart breathed out this breath of passion?</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp17" startOffset="0.00">For no reason, carefully, with my breath and my finger,</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp18" startOffset="15.59">I wipe away a single frost petal</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp19" startOffset="0.00">and press my forehead to the glass.</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp20" startOffset="7.01">A haggard face glimmers in the rattling window</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp21" startOffset="0.00">friend, you walked the road beside me for so long,</textPath></text>
<text font-size="2.55" fill="#ffffff"><textPath href="#tp22" startOffset="9.37">and now I am not even allowed to visit you.</textPath></text>
</g>
</svg>
