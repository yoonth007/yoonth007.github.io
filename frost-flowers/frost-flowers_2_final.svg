<rect id="Paper" width="200" height="200" fill="#ffffff"/>
<g id="Crop_Letter" font-family="'EB Garamond', 'Adobe Garamond Pro', Garamond, serif" font-style="italic">
<text x="92" y="196" font-size="360" fill="#161616">o</text>
</g>
<g id="Type_on_a_Path" font-family="'EB Garamond', 'Adobe Garamond Pro', Garamond, serif" font-style="italic">
<text font-size="3.4" fill="#161616"><textPath href="#petal" startOffset="2%">I wipe away a single frost petal  —  and press my forehead to the glass.</textPath></text>
</g>
<g id="Text_Wrap" font-family="'EB Garamond', 'Adobe Garamond Pro', Garamond, serif" font-style="italic">
<text x="14" y="22" font-size="7.2" fill="#161616">frost flowers</text>
<text x="14" y="28.5" font-size="2.3" fill="#161616">the dawn city bus, a poem in type</text>
<text x="14" y="40" font-size="3.9" fill="#161616">The dawn city bus / runs with its windows decked in some dazzling finery. / The harsher the dead of winter, / the more</text>
<text x="14" y="46.4" font-size="3.9" fill="#161616">vividly the frost flowers bloom. / Those who rode this bus yesterday / maidens and bachelors, children</text>
<text x="14" y="52.8" font-size="3.9" fill="#161616">and grown-ups, / hairdressers, salesmen, housemaids, the jobless / their breath and their sighs /</text>
<text x="14" y="59.2" font-size="3.9" fill="#161616">met in secret overnight and brought forth / this flashing, breathtaking beauty. / As if I</text>
<text x="14" y="65.6" font-size="3.9" fill="#161616">had wandered into some exhibition, / I move from seat to seat to look, / and once</text>
<text x="14" y="72" font-size="3.9" fill="#161616">again I am drunk on a single petal, / on its delicate and cold beauty. / Whose</text>
<text x="14" y="78.4" font-size="3.9" fill="#161616">desolate sigh was this? / What warm heart breathed out this breath of</text>
<text x="14" y="84.8" font-size="3.9" fill="#161616">passion? / For no reason, carefully, with my breath and my finger, / A</text>
<text x="14" y="91.2" font-size="3.9" fill="#161616">haggard face glimmers in the rattling window / friend, you walked</text>
<text x="14" y="97.6" font-size="3.9" fill="#161616">the road beside me for so long, / and now I am not even allowed to</text>
<text x="14" y="104" font-size="3.9" fill="#161616">visit you.</text>
</g>
</svg>
