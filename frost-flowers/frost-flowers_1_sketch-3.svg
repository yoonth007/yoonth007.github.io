<g id="Display_Type" font-family="'Arno Pro', 'EB Garamond', Garamond, serif" font-style="italic">
<g clip-path="url(#light)"><text x="14" y="152" font-size="88" fill="#1a1a1a" transform="rotate(-26.1 14 152)">petal</text></g>
<g clip-path="url(#dark)"><text x="14" y="152" font-size="88" fill="#ffffff" transform="rotate(-26.1 14 152)">petal</text></g>
<text x="196" y="14" font-size="5.5" fill="#1a1a1a" text-anchor="end">frost flowers</text>
<text x="196" y="194" font-size="40" fill="#ffffff" text-anchor="end">you.</text>
</g>
<g id="Poem_on_paths" font-family="'Arno Pro', 'EB Garamond', Garamond, serif" font-style="italic">
<text font-size="2.60" fill="#1a1a1a"><textPath href="#tp1" startOffset="6.76">The dawn city bus</textPath></text>
<text font-size="2.56" fill="#1a1a1a"><textPath href="#tp2" startOffset="0.52">runs with its windows decked in some dazzling finery.</textPath></text>
<text font-size="2.60" fill="#1a1a1a"><textPath href="#tp3" startOffset="16.00">The harsher the dead of winter,</textPath></text>
<text font-size="2.60" fill="#1a1a1a"><textPath href="#tp4" startOffset="17.26">the more vividly the frost flowers bloom.</textPath></text>
<text font-size="2.60" fill="#1a1a1a"><textPath href="#tp5" startOffset="25.54">Those who rode this bus yesterday</textPath></text>
<text font-size="2.60" fill="#1a1a1a"><textPath href="#tp6" startOffset="23.30">maidens and bachelors, children and grown-ups,</textPath></text>
<text font-size="2.60" fill="#1a1a1a"><textPath href="#tp7" startOffset="29.91">hairdressers, salesmen, housemaids, the jobless</textPath></text>
<text font-size="2.60" fill="#1a1a1a"><textPath href="#tp8" startOffset="49.14">their breath and their sighs</textPath></text>
<text font-size="2.60" fill="#1a1a1a"><textPath href="#tp9" startOffset="42.47">met in secret overnight and brought forth</textPath></text>
<text font-size="2.60" fill="#1a1a1a"><textPath href="#tp10" startOffset="50.71">this flashing, breathtaking beauty.</textPath></text>
<text font-size="3.00" fill="#ffffff"><textPath href="#tp11" startOffset="79.88">As if I had wandered into some exhibition,</textPath></text>
<text font-size="3.00" fill="#ffffff"><textPath href="#tp12" startOffset="86.43">I move from seat to seat to look,</textPath></text>
<text font-size="3.00" fill="#ffffff"><textPath href="#tp13" startOffset="78.71">and once again I am drunk on a single petal,</textPath></text>
<text font-size="3.00" fill="#ffffff"><textPath href="#tp14" startOffset="86.62">on its delicate and cold beauty.</textPath></text>
<text font-size="3.00" fill="#ffffff"><textPath href="#tp15" startOffset="77.05">Whose desolate sigh was this?</textPath></text>
<text font-size="3.00" fill="#ffffff"><textPath href="#tp16" startOffset="57.90">What warm heart breathed out this breath of passion?</textPath></text>
<text font-size="3.00" fill="#ffffff"><textPath href="#tp17" startOffset="52.14">For no reason, carefully, with my breath and my finger,</textPath></text>
<text font-size="3.00" fill="#ffffff"><textPath href="#tp18" startOffset="55.51">I wipe away a single frost petal</textPath></text>
<text font-size="3.00" fill="#ffffff"><textPath href="#tp19" startOffset="43.30">and press my forehead to the glass.</textPath></text>
<text font-size="3.00" fill="#ffffff"><textPath href="#tp20" startOffset="30.10">A haggard face glimmers in the rattling window</textPath></text>
<text font-size="2.60" fill="#ffffff"><textPath href="#tp21" startOffset="0.00">friend, you walked the road beside me for so long,</textPath></text>
<text font-size="2.60" fill="#ffffff"><textPath href="#tp22" startOffset="0.00">and now I am not even allowed to visit</textPath></text>
</g>
</svg>
