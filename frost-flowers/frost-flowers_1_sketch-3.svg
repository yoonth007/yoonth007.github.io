<g id="Poem" font-family="'EB Garamond', 'Adobe Garamond Pro', Garamond, serif" font-style="italic" fill="#ffffff">
<text font-size="2.55"><textPath href="#l1" startOffset="0.00">The dawn city bus</textPath></text>
<text font-size="2.55"><textPath href="#l2" startOffset="4.51">runs with its windows decked in some dazzling finery.</textPath></text>
<text font-size="2.55"><textPath href="#l3" startOffset="0.00">The harsher the dead of winter,</textPath></text>
<text font-size="2.55"><textPath href="#l4" startOffset="11.07">the more vividly the frost flowers bloom.</textPath></text>
<text font-size="2.55"><textPath href="#l5" startOffset="0.00">Those who rode this bus yesterday</textPath></text>
<text font-size="2.55"><textPath href="#l6" startOffset="7.12">maidens and bachelors, children and grown-ups,</textPath></text>
<text font-size="2.55"><textPath href="#l7" startOffset="0.00">hairdressers, salesmen, housemaids, the jobless</textPath></text>
<text font-size="2.55"><textPath href="#l8" startOffset="17.12">their breath and their sighs</textPath></text>
<text font-size="2.55"><textPath href="#l9" startOffset="0.00">met in secret overnight and brought forth</textPath></text>
<text font-size="2.55"><textPath href="#l10" startOffset="13.41">this flashing, breathtaking beauty.</textPath></text>
<text font-size="2.55"><textPath href="#l11" startOffset="0.00">As if I had wandered into some exhibition,</textPath></text>
<text font-size="2.55"><textPath href="#l12" startOffset="15.44">I move from seat to seat to look,</textPath></text>
<text font-size="2.55"><textPath href="#l13" startOffset="0.00">and once again I am drunk on a single petal,</textPath></text>
<text font-size="2.55"><textPath href="#l14" startOffset="15.42">on its delicate and cold beauty.</textPath></text>
<text font-size="2.55"><textPath href="#l15" startOffset="0.00">Whose desolate sigh was this?</textPath></text>
<text font-size="2.55"><textPath href="#l16" startOffset="4.07">What warm heart breathed out this breath of passion?</textPath></text>
<text font-size="2.55"><textPath href="#l17" startOffset="0.00">For no reason, carefully, with my breath and my finger,</textPath></text>
<text font-size="2.55"><textPath href="#l18" startOffset="15.62">I wipe away a single frost petal</textPath></text>
<text font-size="2.55"><textPath href="#l19" startOffset="0.00">and press my forehead to the glass.</textPath></text>
<text font-size="2.55"><textPath href="#l20" startOffset="6.99">A haggard face glimmers in the rattling window</textPath></text>
<text font-size="2.55"><textPath href="#l21" startOffset="0.00">friend, you walked the road beside me for so long,</textPath></text>
<text font-size="2.55"><textPath href="#l22" startOffset="9.38">and now I am not even allowed to visit you.</textPath></text>
</g>
<g id="Title" >
<text x="153.5" y="9" font-size="4" fill="#1a1a1a" font-family="'EB Garamond', 'Adobe Garamond Pro', Garamond, serif" font-style="italic">frost flowers</text>
</g>
