<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="200mm" viewBox="0 0 200 200">
<title>frost flowers — sketch 3</title>
<defs>

</defs>
<g id="Ground" >
<rect width="200" height="200" fill="#1b1b1b"/>
</g>
<g id="Big_f" font-family="'Playfair Display', serif" font-style="italic" font-weight="700">
<text x="118" y="150" font-size="210" fill="#ffffff">f</text>
</g>
<g id="Tumbling_letters" font-family="'Playfair Display', serif" font-style="italic" font-weight="700">
<text x="34" y="52" font-size="15" fill="#ffffff">r</text>
<text x="70" y="92" font-size="12" fill="#ffffff">o</text>
<text x="52" y="128" font-size="10" fill="#ffffff">s</text>
<text x="96" y="150" font-size="8" fill="#ffffff">t</text>
</g>
<g id="Broken_lines" font-family="'EB Garamond', serif" fill="#8c8c8c">
<text x="32.5" y="43.75" font-size="2.3" text-anchor="end">The dawn</text>
<text x="44.05" y="43.75" font-size="2.3">city bus</text>
<text x="32.5" y="47.15" font-size="2.3" text-anchor="end">runs with its windows</text>
<text x="44.05" y="47.15" font-size="2.3">decked in some dazzling finery.</text>
<text x="32.5" y="50.55" font-size="2.3" text-anchor="end">The harsher the</text>
<text x="44.05" y="50.55" font-size="2.3">dead of winter,</text>
<text x="32.5" y="53.95" font-size="2.3" text-anchor="end">the more vividly</text>
<text x="44.05" y="53.95" font-size="2.3">the frost flowers bloom.</text>
<text x="68.5" y="85.4" font-size="2.3" text-anchor="end">Those who rode</text>
<text x="79.35" y="85.4" font-size="2.3">this bus yesterday</text>
<text x="68.5" y="88.8" font-size="2.3" text-anchor="end">maidens and bachelors,</text>
<text x="79.35" y="88.8" font-size="2.3">children and grown-ups,</text>
<text x="68.5" y="92.2" font-size="2.3" text-anchor="end">hairdressers, salesmen,</text>
<text x="79.35" y="92.2" font-size="2.3">housemaids, the jobless</text>
<text x="68.5" y="95.6" font-size="2.3" text-anchor="end">their breath</text>
<text x="79.35" y="95.6" font-size="2.3">and their sighs</text>
<text x="50.5" y="122.5" font-size="2.3" text-anchor="end">met in secret</text>
<text x="59.2" y="122.5" font-size="2.3">overnight and brought forth</text>
<text x="50.5" y="125.9" font-size="2.3" text-anchor="end">this flashing,</text>
<text x="59.2" y="125.9" font-size="2.3">breathtaking beauty.</text>
<text x="50.5" y="129.3" font-size="2.3" text-anchor="end">As if I had</text>
<text x="59.2" y="129.3" font-size="2.3">wandered into some exhibition,</text>
<text x="50.5" y="132.7" font-size="2.3" text-anchor="end">I move from seat</text>
<text x="59.2" y="132.7" font-size="2.3">to seat to look,</text>
<text x="94.5" y="145.6" font-size="2.3" text-anchor="end">and once again I am</text>
<text x="101.82" y="145.6" font-size="2.3">drunk on a single petal,</text>
<text x="94.5" y="149" font-size="2.3" text-anchor="end">on its delicate</text>
<text x="101.82" y="149" font-size="2.3">and cold beauty.</text>
<text x="94.5" y="152.4" font-size="2.3" text-anchor="end">Whose desolate</text>
<text x="101.82" y="152.4" font-size="2.3">sigh was this?</text>
<text x="94.5" y="155.8" font-size="2.3" text-anchor="end">What warm heart breathed</text>
<text x="101.82" y="155.8" font-size="2.3">out this breath of passion?</text>
</g>
<g id="Case_pairs" >
<text x="14" y="186" font-size="3.2" fill="#8c8c8c" font-family="'EB Garamond', serif">f</text>
<text x="16.4" y="187.2" font-size="6.5" fill="#ffffff" font-family="'EB Garamond', serif">F</text>
<text x="26" y="183.65" font-size="3.2" fill="#8c8c8c" font-family="'EB Garamond', serif">l</text>
<text x="28.4" y="184.85" font-size="6.5" fill="#ffffff" font-family="'EB Garamond', serif">L</text>
<text x="41" y="183.08" font-size="3.2" fill="#8c8c8c" font-family="'EB Garamond', serif">o</text>
<text x="43.4" y="184.28" font-size="6.5" fill="#ffffff" font-family="'EB Garamond', serif">O</text>
<text x="53" y="184.72" font-size="3.2" fill="#8c8c8c" font-family="'EB Garamond', serif">w</text>
<text x="55.4" y="185.92" font-size="6.5" fill="#ffffff" font-family="'EB Garamond', serif">W</text>
<text x="68" y="187.33" font-size="3.2" fill="#8c8c8c" font-family="'EB Garamond', serif">e</text>
<text x="70.4" y="188.53" font-size="6.5" fill="#ffffff" font-family="'EB Garamond', serif">E</text>
<text x="80" y="188.93" font-size="3.2" fill="#8c8c8c" font-family="'EB Garamond', serif">r</text>
<text x="82.4" y="190.13" font-size="6.5" fill="#ffffff" font-family="'EB Garamond', serif">R</text>
<text x="95" y="188.32" font-size="3.2" fill="#8c8c8c" font-family="'EB Garamond', serif">s</text>
<text x="97.4" y="189.52" font-size="6.5" fill="#ffffff" font-family="'EB Garamond', serif">S</text>
</g>
<g id="Falling" >
<text x="176" y="118" font-size="3.2" fill="#8c8c8c" font-family="'EB Garamond', serif">s</text>
<text x="173.8" y="127" font-size="3.2" fill="#8c8c8c" font-family="'EB Garamond', serif">i</text>
<text x="171.6" y="136" font-size="3.2" fill="#8c8c8c" font-family="'EB Garamond', serif">g</text>
<text x="169.4" y="145" font-size="3.2" fill="#8c8c8c" font-family="'EB Garamond', serif">h</text>
<text x="167.2" y="154" font-size="3.2" fill="#8c8c8c" font-family="'EB Garamond', serif">s</text>
</g>
<g id="Edge_Caption" >
<text x="0" y="0" font-size="2.2" fill="#8c8c8c" font-family="'EB Garamond', serif" transform="translate(186.3 188) rotate(-90)">friend, you walked the road beside me for so long,</text>
<text x="0" y="0" font-size="2.2" fill="#8c8c8c" font-family="'EB Garamond', serif" transform="translate(189.5 188) rotate(-90)">and now I am not even allowed to visit you.</text>
</g>
</svg>
