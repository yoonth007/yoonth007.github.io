<g id="Ground" >
<rect width="200" height="200" fill="#111418"/>
</g>
<g id="Mass" >
<text x="0" y="0" font-size="118" fill="#363d45" letter-spacing="-4" font-family="'PlayfairBlack', 'Playfair Display'" font-style="italic" font-weight="900" transform="translate(206 214) rotate(-90)">flowers</text>
<text x="-10" y="226" font-size="200" fill="#dfe3e6" letter-spacing="-6" font-family="'PlayfairBlack', 'Playfair Display'" font-style="italic" font-weight="900">you</text>
</g>
<g id="Poem_on_paths" font-family="'CaslonBold', 'Libre Caslon Text'" font-style="italic" font-weight="700">
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl1" startOffset="22.00">The dawn city bus</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl2" startOffset="31.59">runs with its windows decked in some dazzling finery.</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl3" startOffset="38.83">The harsher the dead of winter,</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl4" startOffset="41.95">the more vividly the frost flowers bloom.</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl5" startOffset="40.19">Those who rode this bus yesterday</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl6" startOffset="33.97">maidens and bachelors, children and grown-ups,</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl7" startOffset="24.82">hairdressers, salesmen, housemaids, the jobless</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl8" startOffset="14.98">their breath and their sighs</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl9" startOffset="6.86">met in secret overnight and brought forth</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl10" startOffset="2.45">this flashing, breathtaking beauty.</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl11" startOffset="2.82">As if I had wandered into some exhibition,</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl12" startOffset="7.89">I move from seat to seat to look,</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl13" startOffset="16.41">and once again I am drunk on a single petal,</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl14" startOffset="26.30">on its delicate and cold beauty.</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl15" startOffset="35.14">Whose desolate sigh was this?</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl16" startOffset="40.76">What warm heart breathed out this breath of passion?</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl17" startOffset="41.79">For no reason, carefully, with my breath and my finger,</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl18" startOffset="37.97">I wipe away a single frost petal</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl19" startOffset="30.24">and press my forehead to the glass.</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl20" startOffset="20.50">A haggard face glimmers in the rattling window</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl21" startOffset="11.12">friend, you walked the road beside me for so long,</textPath></text>
<text font-size="3.10" fill="#aeb5bc"><textPath href="#wl22" startOffset="4.41">and now I am not even allowed to visit you.</textPath></text>
</g>
</svg>
