<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="200mm" viewBox="0 0 200 200">
<title>frost flowers — sketch 3</title>
<defs>
<linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eeeeec"/><stop offset="0.45" stop-color="#e2e2e0"/><stop offset="1" stop-color="#9a9da1"/></linearGradient>
</defs>
<g id="Paper" >
<rect width="200" height="200" fill="url(#dusk)"/>
</g>
<g id="Funnel" >
<text x="14" y="20" font-size="3.60" fill="#242425" textLength="172.00" lengthAdjust="spacing" font-family="'EB Garamond', serif">The dawn city bus</text>
<text x="19.62" y="26" font-size="3.52" fill="#272828" textLength="160.77" lengthAdjust="spacing" font-family="'EB Garamond', serif">runs with its windows decked in some dazzling <tspan font-family="ArchivoStep7" font-size="4.76">FINERY.</tspan></text>
<text x="25.23" y="31.82" font-size="3.45" fill="#2b2b2c" textLength="149.54" lengthAdjust="spacing" font-family="'EB Garamond', serif">The harsher the dead of <tspan font-family="'Bodoni Moda', serif" font-style="italic" font-size="5.86">winter,</tspan></text>
<text x="30.85" y="37.45" font-size="3.37" fill="#2e2e2f" textLength="138.31" lengthAdjust="spacing" font-family="'EB Garamond', serif">the more vividly the <tspan font-family="ArchivoStep2" font-size="5.05">FROST</tspan> <tspan font-family="'Bodoni Moda', serif" font-style="italic" font-size="7.08">flowers</tspan> bloom.</text>
<text x="36.46" y="42.89" font-size="3.29" fill="#313233" textLength="127.08" lengthAdjust="spacing" font-family="'EB Garamond', serif">Those who rode this bus yesterday</text>
<text x="42.08" y="48.15" font-size="3.22" fill="#343536" textLength="115.85" lengthAdjust="spacing" font-family="'EB Garamond', serif">maidens and bachelors, children and grown-ups,</text>
<text x="47.69" y="53.23" font-size="3.14" fill="#373839" textLength="104.62" lengthAdjust="spacing" font-family="'EB Garamond', serif">hairdressers, salesmen, housemaids, the jobless</text>
<text x="53.31" y="58.12" font-size="3.06" fill="#3a3b3d" textLength="93.38" lengthAdjust="spacing" font-family="'EB Garamond', serif">their <tspan font-family="ArchivoStep2" font-size="4.59">BREATH</tspan> and their <tspan font-family="'Bodoni Moda', serif" font-style="italic" font-size="6.43">sighs</tspan></text>
<text x="58.92" y="62.83" font-size="2.98" fill="#3d3f40" textLength="82.15" lengthAdjust="spacing" font-family="'EB Garamond', serif">met in secret overnight and brought forth</text>
<text x="64.54" y="67.35" font-size="2.91" fill="#414244" textLength="70.92" lengthAdjust="spacing" font-family="'EB Garamond', serif">this flashing, breathtaking <tspan font-family="ArchivoStep7" font-size="3.93">BEAUTY.</tspan></text>
<text x="70.15" y="71.69" font-size="2.83" fill="#444547" textLength="59.69" lengthAdjust="spacing" font-family="'EB Garamond', serif">As if I had wandered into some <tspan font-family="'Bodoni Moda', serif" font-style="italic" font-size="4.81">exhibition,</tspan></text>
<text x="75.77" y="75.85" font-size="2.75" fill="#47484b" textLength="48.46" lengthAdjust="spacing" font-family="'EB Garamond', serif">I move from seat to seat to look,</text>
<text x="81.38" y="79.82" font-size="2.68" fill="#4a4c4e" textLength="37.23" lengthAdjust="spacingAndGlyphs" font-family="'EB Garamond', serif">and once again I am drunk on a single <tspan font-family="'Bodoni Moda', serif" font-style="italic" font-size="5.62">petal,</tspan></text>
<text x="87" y="83.6" font-size="2.60" fill="#4d4f51" textLength="26.00" lengthAdjust="spacingAndGlyphs" font-family="'EB Garamond', serif">on its delicate and cold <tspan font-family="ArchivoStep7" font-size="3.51">BEAUTY.</tspan></text>
</g>
<g id="Drip" >
<text x="100" y="91.2" font-size="5.46" fill="#494b4d" font-family="'Bodoni Moda', serif" font-style="italic" text-anchor="middle">Whose</text>
<text x="101.45" y="94.4" font-size="3.51" fill="#4c4d50" font-family="ArchivoStep7" text-anchor="middle">DESOLATE</text>
<text x="100.77" y="97.95" font-size="4.42" fill="#4e5052" font-family="'Bodoni Moda', serif" font-style="italic" text-anchor="middle">sigh</text>
<text x="98.97" y="101.89" font-size="3.9" fill="#505255" font-family="ArchivoStep2" text-anchor="middle">WAS</text>
<text x="98.67" y="106.27" font-size="5.46" fill="#535558" font-family="'Bodoni Moda', serif" font-style="italic" text-anchor="middle">this?</text>
<text x="100.32" y="111.13" font-size="3.51" fill="#55585a" font-family="ArchivoStep7" text-anchor="middle">FOR</text>
<text x="101.5" y="116.52" font-size="4.42" fill="#585a5d" font-family="'Bodoni Moda', serif" font-style="italic" text-anchor="middle">no</text>
<text x="100.48" y="122.51" font-size="3.9" fill="#5a5d60" font-family="ArchivoStep2" text-anchor="middle">REASON</text>
<text x="98.76" y="129.15" font-size="5.46" fill="#5d5f62" font-family="'Bodoni Moda', serif" font-style="italic" text-anchor="middle">carefully</text>
<text x="98.86" y="136.52" font-size="3.51" fill="#5f6265" font-family="ArchivoStep7" text-anchor="middle">WITH</text>
<text x="100.63" y="144.71" font-size="4.42" fill="#626468" font-family="'Bodoni Moda', serif" font-style="italic" text-anchor="middle">my</text>
<text x="101.48" y="153.8" font-size="3.9" fill="#64676a" font-family="ArchivoStep2" text-anchor="middle">BREATH</text>
</g>
<g id="Sunk_you" >
<text x="100" y="222" fill="#1e2022" text-anchor="middle"><tspan font-family="'Bodoni Moda', serif" font-style="italic" font-size="112.00">y</tspan><tspan font-family="ArchivoStep7" font-size="91.84">O</tspan><tspan font-family="'EB Garamond', serif" font-style="italic" font-size="125.44">u</tspan></text>
</g>
</svg>
