<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="200mm" viewBox="0 0 200 200">
<title>frost flowers — sketch 3</title>
<defs>
<path id="arcTop" d="M17 30 A17 17 0 0 1 51 30"/>
<path id="arcBot" d="M14 33 A20 20 0 0 0 54 33"/>
</defs>
<g id="Paper" >
<rect width="200" height="200" fill="#ffffff"/>
</g>
<g id="Big_y" >
<text x="84" y="146" font-size="190" fill="#1a1a1a" font-family="ArchivoStep7">y</text>
</g>
<g id="Along_the_y" >
<text x="89.5" y="66" font-size="3.2" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">The dawn city bus</text>
<text x="92.5" y="72" font-size="3.2" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">runs with its windows decked in some dazzling finery.</text>
<text x="95.25" y="78" font-size="3.2" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">The harsher the dead of winter,</text>
<text x="98.25" y="84" font-size="3.2" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">the more vividly the frost flowers bloom.</text>
<text x="101.25" y="90" font-size="3.2" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">this flashing, breathtaking beauty.</text>
<text x="104" y="96" font-size="3.2" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">As if I had wandered into some exhibition,</text>
<text x="107" y="102" font-size="3.2" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">I move from seat to seat to look,</text>
<text x="109.75" y="108" font-size="3.2" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">and once again I am drunk on a single petal,</text>
<text x="112.75" y="114" font-size="3.2" fill="#1a1a1a" font-family="'EB Garamond', serif" text-anchor="end">on its delicate and cold beauty.</text>
</g>
<g id="Arcs" >
<text font-size="2.48" font-family="'EB Garamond', serif" font-style="italic" fill="#1a1a1a"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">For no reason, carefully, with my breath and my finger,</textPath></text><text font-size="2.90" font-family="'EB Garamond', serif" fill="#555"><textPath href="#arcBot" startOffset="50%" text-anchor="middle">I wipe away a single frost petal on the glass.</textPath></text>
</g>
<g id="Tone" >
<text x="98" y="40" font-size="32" fill="#d9d9d9" font-family="'EB Garamond', serif" font-style="italic">breath</text><text x="128" y="34" font-size="5.2" fill="#1a1a1a" font-family="'EB Garamond', serif" font-style="italic">sigh</text>
</g>
<g id="Struck" >
<text x="14" y="148" font-size="3" fill="#1a1a1a" font-family="'EB Garamond', serif">Those who rode this bus yesterday</text>
<text x="14" y="153.2" font-size="3" fill="#1a1a1a" font-family="'EB Garamond', serif">maidens and bachelors, children and grown-ups,</text>
<line x1="14" y1="152.2" x2="69.09" y2="152.2" stroke="#1a1a1a" stroke-width="0.25"/>
<text x="14" y="158.4" font-size="3" fill="#1a1a1a" font-family="'EB Garamond', serif">hairdressers, salesmen, housemaids, the jobless</text>
<line x1="14" y1="157.4" x2="66.48" y2="157.4" stroke="#1a1a1a" stroke-width="0.25"/>
<text x="14" y="166.6" font-size="3" fill="#1a1a1a" font-family="'EB Garamond', serif" font-style="italic">their breath and their sighs</text>
</g>
<g id="Title" >
<text x="186" y="192" font-size="3" fill="#1a1a1a" font-family="'EB Garamond', serif" font-style="italic" text-anchor="end">frost flowers</text>
</g>
</svg>
