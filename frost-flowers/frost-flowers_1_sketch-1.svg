<g id="Type_on_a_Path" font-family="'EB Garamond', 'Adobe Garamond Pro', Garamond, serif" font-style="italic">
<text font-size="3.2" fill="#161616"><textPath href="#petal" startOffset="2%">I wipe away a single frost petal  —  and press my forehead to the glass.</textPath></text>
</g>
<g id="Text_Wrap" font-family="'EB Garamond', 'Adobe Garamond Pro', Garamond, serif" font-style="italic">
<text x="12" y="20" font-size="3.8" fill="#161616">The dawn city bus / runs with its windows decked in some dazzling finery. / The harsher the dead of winter, / the more vividly</text>
<text x="12" y="26.3" font-size="3.8" fill="#161616">the frost flowers bloom. / Those who rode this bus yesterday / maidens and bachelors, children and grown-ups, / hairdressers,</text>
<text x="12" y="32.6" font-size="3.8" fill="#161616">salesmen, housemaids, the jobless / their breath and their sighs / met in secret overnight and brought forth / this flashing,</text>
<text x="12" y="38.9" font-size="3.8" fill="#161616">breathtaking beauty. / As if I had wandered into some exhibition, / I move from seat to seat to look, / and once again I am</text>
<text x="12" y="45.2" font-size="3.8" fill="#161616">drunk on a single petal, / on its delicate and cold beauty. / Whose desolate sigh was this? / What warm heart</text>
<text x="12" y="51.5" font-size="3.8" fill="#161616">breathed out this breath of passion? / For no reason, carefully, with my breath and my finger, / A</text>
<text x="12" y="57.8" font-size="3.8" fill="#161616">haggard face glimmers in the rattling window / friend, you walked the road beside me for</text>
<text x="12" y="64.1" font-size="3.8" fill="#161616">so long, / and now I am not even allowed to visit you.</text>
</g>
</svg>
