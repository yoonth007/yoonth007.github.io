<rect id="Paper" width="200" height="200" fill="#ffffff"/>
<g id="Crop_Letter" font-family="'EB Garamond', 'Adobe Garamond Pro', Garamond, serif" font-style="italic">
<text x="88" y="194" font-size="350" fill="#161616">o</text>
